<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Architecture overview: Claude, local MCP server, PySpark, and the INE API</title>
<desc>Claude acts as the MCP host, invoking a local Python MCP server over stdio. The server exposes tools, rate-limits and retries requests, processes data with PySpark, and calls the public INE statistics API over HTTPS, returning structured results back up the chain.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0" y="0" width="680" height="480" fill="#FFFFFF"/>

<rect x="40" y="50" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="115" y="70" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">User</text>
<text x="115" y="88" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Natural language</text>

<line x1="190" y1="70" x2="215" y2="70" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow)"/>
<line x1="215" y1="86" x2="190" y2="86" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#arrow)"/>

<rect x="215" y="50" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Claude (MCP host)</text>
<text x="340" y="86" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Selects the right MCP tool</text>

<line x1="330" y1="106" x2="330" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="350" y1="170" x2="350" y2="106" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400" y="138" text-anchor="start" font-family="sans-serif" font-size="12" fill="#444441">MCP invocation (stdio)</text>

<rect x="100" y="170" width="480" height="150" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="120" y="196" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Local process (.venv)</text>
<text x="120" y="212" text-anchor="start" font-family="sans-serif" font-size="12" fill="#444441">Hosts the MCP server</text>

<rect x="120" y="225" width="140" height="70" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="190" y="251" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">MCP server</text>
<text x="190" y="269" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Exposes tools</text>

<rect x="270" y="225" width="140" height="70" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="251" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Rate limiter</text>
<text x="340" y="269" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Retry &amp; backoff</text>

<rect x="420" y="225" width="140" height="70" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="490" y="251" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">PySpark engine</text>
<text x="490" y="269" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Transforms data</text>

<line x1="300" y1="320" x2="300" y2="380" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="380" y1="380" x2="380" y2="320" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="420" y="350" text-anchor="start" font-family="sans-serif" font-size="12" fill="#444441">HTTPS / REST</text>

<rect x="215" y="380" width="250" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
<text x="340" y="398" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4B1528">INE statistics API</text>
<text x="340" y="416" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#72243E">Public, unauthenticated</text>
</svg>
